<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THOCR 西夏文字识别系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #2c3e50 0%, #4a6491 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        
        header .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        .content {
            padding: 30px;
        }
        
        .upload-section {
            background: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }
        
        .upload-section:hover {
            border-color: #6c757d;
            background: #f1f3f4;
        }
        
        .upload-section.drag-over {
            border-color: #007bff;
            background: #e7f1ff;
        }
        
        .upload-icon {
            font-size: 48px;
            color: #6c757d;
            margin-bottom: 20px;
        }
        
        .upload-text h3 {
            margin-bottom: 15px;
            color: #495057;
        }
        
        .upload-text p {
            color: #6c757d;
            margin-bottom: 25px;
        }
        
        .file-input-wrapper {
            position: relative;
            display: inline-block;
        }
        
        .file-input {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.2);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
            box-shadow: 0 4px 15px rgba(108, 117, 125, 0.2);
        }
        
        .btn-secondary:hover {
            box-shadow: 0 6px 20px rgba(108, 117, 125, 0.3);
        }
        
        .btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .preview-section {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .image-preview {
            flex: 1;
            min-width: 300px;
        }
        
        .image-preview img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: none;
        }
        
        .result-section {
            flex: 1;
            min-width: 300px;
        }
        
        .section-title {
            font-size: 1.3rem;
            color: #495057;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
        }
        
        .result-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }
        
        .result-item {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f1f3f4;
        }
        
        .result-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        
        .result-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        
        .result-label i {
            margin-right: 10px;
            color: #007bff;
        }
        
        .result-value {
            font-size: 1.2rem;
            color: #212529;
            word-break: break-all;
        }
        
        .structure-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.9rem;
            margin-left: 10px;
        }
        
        .badge-single { background: #e3f2fd; color: #1976d2; }
        .badge-vertical { background: #f3e5f5; color: #7b1fa2; }
        .badge-horizontal { background: #e8f5e8; color: #388e3c; }
        .badge-enclosed { background: #fff3e0; color: #f57c00; }
        
        .confidence-bar {
            height: 10px;
            background: #e9ecef;
            border-radius: 5px;
            margin: 10px 0;
            overflow: hidden;
        }
        
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50 0%, #8bc34a 100%);
            border-radius: 5px;
            transition: width 1s ease;
        }
        
        .confidence-text {
            text-align: right;
            font-size: 0.9rem;
            color: #6c757d;
        }
        
        .actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #c00;
            display: none;
        }
        
        .character-display {
            font-size: 3rem;
            text-align: center;
            margin: 20px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }
        
        .info-box {
            background: #e7f3ff;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
        }
        
        .info-box h4 {
            color: #0056b3;
            margin-bottom: 10px;
        }
        
        .info-box ul {
            padding-left: 20px;
            color: #495057;
        }
        
        .info-box li {
            margin-bottom: 8px;
        }
        
        footer {
            text-align: center;
            padding: 20px;
            color: #6c757d;
            font-size: 0.9rem;
            border-top: 1px solid #e9ecef;
            margin-top: 30px;
        }
        
        @media (max-width: 768px) {
            .preview-section {
                flex-direction: column;
            }
            
            .image-preview, .result-section {
                min-width: 100%;
            }
            
            header {
                padding: 30px 20px;
            }
            
            header h1 {
                font-size: 2rem;
            }
            
            .content {
                padding: 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-language"></i> THOCR 西夏文分层识别系统</h1>
            <div class="subtitle">
                基于深度学习的西夏文分层识别技术
            </div>
        </header>
        
        <div class="content">
            <div class="upload-section" id="uploadSection">
                <div class="upload-icon">
                    <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <div class="upload-text">
                    <h3>上传西夏文字图片</h3>
                    <p>支持 JPG、PNG、WEBP 格式，建议图片清晰，文字居中</p>
                    <div class="file-input-wrapper">
                        <button class="btn" id="selectBtn">
                            <i class="fas fa-folder-open"></i> 选择图片
                        </button>
                        <input type="file" id="fileInput" class="file-input" accept=".jpg,.jpeg,.png,.webp">
                    </div>
                    <p style="margin-top: 15px;">或直接将图片拖拽到此处</p>
                </div>
            </div>
            
            <div class="error" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i> <span id="errorText"></span>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在识别，请稍候...</p>
            </div>
            
            <div class="preview-section" id="previewSection" style="display: none;">
                <div class="image-preview">
                    <h3 class="section-title"><i class="fas fa-image"></i> 图片预览</h3>
                    <img id="previewImage" alt="预览图片">
                </div>
                
                <div class="result-section">
                    <h3 class="section-title"><i class="fas fa-search"></i> 识别结果</h3>
                    <div class="result-card">
                        <div class="character-display" id="characterDisplay">
                            等待识别结果...
                        </div>
                        
                        <div class="result-item">
                            <div class="result-label">
                                <i class="fas fa-project-diagram"></i> 文字结构
                            </div>
                            <div class="result-value" id="structureResult">
                                -
                            </div>
                        </div>
                        
                        <div class="result-item">
                            <div class="result-label">
                                <i class="fas fa-font"></i> Unicode编码
                            </div>
                            <div class="result-value" id="unicodeResult">
                                -
                            </div>
                        </div>
                        
                        <div class="result-item">
                            <div class="result-label">
                                <i class="fas fa-chart-line"></i> 结构识别置信度
                            </div>
                            <div class="confidence-bar">
                                <div class="confidence-fill" id="structureConfidenceBar" style="width: 0%"></div>
                            </div>
                            <div class="confidence-text">
                                <span id="structureConfidenceText">0%</span>
                            </div>
                        </div>
                        
                        <div class="result-item">
                            <div class="result-label">
                                <i class="fas fa-chart-bar"></i> 字符识别置信度
                            </div>
                            <div class="confidence-bar">
                                <div class="confidence-fill" id="characterConfidenceBar" style="width: 0%"></div>
                            </div>
                            <div class="confidence-text">
                                <span id="characterConfidenceText">0%</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    
            
            <div class="actions" id="actionButtons" style="display: none;">
                <button class="btn" id="recognizeBtn">
                    <i class="fas fa-play"></i> 开始识别
                </button>
                <button class="btn btn-secondary" id="resetBtn">
                    <i class="fas fa-redo"></i> 重新选择
                </button>
            </div>
        </div>
        
        <footer>
            <p>© 2025 THOCR 西夏文字识别系统 | 基于深度学习的文字识别技术</p>
        </footer>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const previewImage = document.getElementById('previewImage');
        const uploadSection = document.getElementById('uploadSection');
        const previewSection = document.getElementById('previewSection');
        const actionButtons = document.getElementById('actionButtons');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        
        const characterDisplay = document.getElementById('characterDisplay');
        const structureResult = document.getElementById('structureResult');
        const unicodeResult = document.getElementById('unicodeResult');
        const structureConfidenceBar = document.getElementById('structureConfidenceBar');
        const structureConfidenceText = document.getElementById('structureConfidenceText');
        const characterConfidenceBar = document.getElementById('characterConfidenceBar');
        const characterConfidenceText = document.getElementById('characterConfidenceText');
        
        const recognizeBtn = document.getElementById('recognizeBtn');
        const resetBtn = document.getElementById('resetBtn');
        const selectBtn = document.getElementById('selectBtn');
        

        const API_URL = 'http://localhost:5000/recognize';
        

        let currentFile = null;
        

        const structureMap = {
            'single': { name: '独立型', badge: 'badge-single', code: 'S' },
            'vertical': { name: '竖叠型', badge: 'badge-vertical', code: 'V' },
            'horizontal': { name: '横叠型', badge: 'badge-horizontal', code: 'H' },
            'enclosed': { name: '半围型', badge: 'badge-enclosed', code: 'E' }
        };
        
        fileInput.addEventListener('change', handleFileSelect);
        selectBtn.addEventListener('click', () => fileInput.click());
        

        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('drag-over');
        });
        
        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('drag-over');
        });
        
        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('drag-over');
            
            if (e.dataTransfer.files.length) {
                const file = e.dataTransfer.files[0];
                if (isValidImageFile(file)) {
                    handleFile(file);
                } else {
                    showError('请选择有效的图片文件 (JPG, PNG, WEBP)');
                }
            }
        });
        
 
        recognizeBtn.addEventListener('click', recognizeImage);
        

        resetBtn.addEventListener('click', resetAll);
        

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file && isValidImageFile(file)) {
                handleFile(file);
            } else if (file) {
                showError('请选择有效的图片文件 (JPG, PNG, WEBP)');
            }
        }
        

        function handleFile(file) {
            currentFile = file;
            

            const reader = new FileReader();
            reader.onload = function(e) {
                previewImage.src = e.target.result;
                previewImage.style.display = 'block';
                

                previewSection.style.display = 'flex';
                actionButtons.style.display = 'flex';
                uploadSection.style.display = 'none';
                errorMessage.style.display = 'none';
                

                resetResults();
            };
            reader.readAsDataURL(file);
        }
        

        function isValidImageFile(file) {
            const validTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/webp'];
            return validTypes.includes(file.type);
        }
        

        async function recognizeImage() {
            if (!currentFile) {
                showError('请先选择图片');
                return;
            }
            

            loading.style.display = 'block';
            recognizeBtn.disabled = true;
            errorMessage.style.display = 'none';
            
            try {
                const formData = new FormData();
                formData.append('image', currentFile);
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    displayResults(data);
                } else {
                    showError(data.error || '识别失败');
                }
            } catch (error) {
                showError('网络错误: ' + error.message);
            } finally {
                loading.style.display = 'none';
                recognizeBtn.disabled = false;
            }
        }
        

        function displayResults(data) {
            const structureInfo = structureMap[data.structure] || 
                                 { name: data.structure, badge: '', code: '' };
            

            characterDisplay.textContent = `字符 ${data.character}`;
            
            structureResult.innerHTML = `
                ${structureInfo.name}
                <span class="structure-badge ${structureInfo.badge}">${data.structure_code}</span>
            `;
            

            unicodeResult.textContent = data.character;
            

            const structureConfidence = (data.confidence.structure * 100).toFixed(1);
            const characterConfidence = (data.confidence.character * 100).toFixed(1);
            
            structureConfidenceBar.style.width = `${structureConfidence}%`;
            structureConfidenceText.textContent = `${structureConfidence}%`;
            
            characterConfidenceBar.style.width = `${characterConfidence}%`;
            characterConfidenceText.textContent = `${characterConfidence}%`;

            characterDisplay.style.animation = 'none';
            setTimeout(() => {
                characterDisplay.style.animation = 'pulse 0.5s';
            }, 10);
        }
        

        function resetResults() {
            characterDisplay.textContent = '等待识别结果...';
            structureResult.textContent = '-';
            unicodeResult.textContent = '-';
            
            structureConfidenceBar.style.width = '0%';
            structureConfidenceText.textContent = '0%';
            characterConfidenceBar.style.width = '0%';
            characterConfidenceText.textContent = '0%';
        }
        

        function resetAll() {
            currentFile = null;
            fileInput.value = '';
            
            previewImage.style.display = 'none';
            previewSection.style.display = 'none';
            actionButtons.style.display = 'none';
            uploadSection.style.display = 'block';
            errorMessage.style.display = 'none';
            
            resetResults();
        }
        
        function showError(message) {
            errorText.textContent = message;
            errorMessage.style.display = 'block';
            

            setTimeout(() => {
                errorMessage.style.display = 'none';
            }, 5000);
        }
        
        resetAll();
    </script>
</body>
</html>
